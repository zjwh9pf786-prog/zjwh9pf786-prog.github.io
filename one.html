<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小程序聚合平台</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        /* 小程序卡片样式 */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .app-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .app-card:hover {
            transform: translateY(-5px);
        }
        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 16px; /* 小程序图标圆角风格 */
            margin: 0 auto 10px;
            object-fit: cover;
        }
        .app-name {
            font-size: 16px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>我的小程序合集</h1>
        <div class="app-grid">
            <!-- 小程序1：替换为你的小程序信息 -->
            <div class="app-card" onclick="openMiniProgram('weixin://dl/business/?t=你的小程序1跳转链接')">
                <img src="浮生半日图标.jpg" class="app-icon" alt="小程序1">
                <p class="app-name">浮生半日</p>
            </div>

            <!-- 小程序2：继续添加 -->
            <div class="app-card" onclick="openMiniProgram('weixin://dl/business/?t=你的小程序2跳转链接')">
                <img src="小程序2图标.jpg" class="app-icon" alt="小程序2">
                <p class="app-name">小程序名称2</p>
            </div>

            <!-- 可继续添加更多小程序 -->
        </div>
    </div>

    <script>
        // 打开小程序的函数
        function openMiniProgram(url) {
            // 提示用户在微信内打开（如果当前环境不是微信）
            if (!navigator.userAgent.includes('MicroMessenger')) {
                alert('请在微信内打开本页面以访问小程序');
                return;
            }
            // 跳转到小程序
            window.location.href = url;
        }
    </script>
</body>
</html>
